<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Alvarmethod</title>
  <desc id="desc">One teacher, one mind. Probe, plan, teach.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1014"/>
      <stop offset="100%" stop-color="#121a16"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d5c4a"/>
      <stop offset="50%" stop-color="#e8b86d"/>
      <stop offset="100%" stop-color="#3d5c4a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .dash { stroke-dasharray: 8 10; animation: crawl 2.4s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; }
      .p1 { animation: pop 3.6s ease-in-out infinite; }
      .p2 { animation: pop 3.6s ease-in-out 1.2s infinite; }
      .p3 { animation: pop 3.6s ease-in-out 2.4s infinite; }
      .scan { animation: scan 4.8s ease-in-out infinite; }
      @keyframes crawl { to { stroke-dashoffset: -72; } }
      @keyframes pop {
        0%, 100% { opacity: .72; }
        28% { opacity: 1; }
      }
      @keyframes scan {
        0%, 100% { transform: translateX(-40px); opacity: 0; }
        15% { opacity: .35; }
        50% { transform: translateX(1000px); opacity: .12; }
        70%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="960" height="280" rx="18" fill="url(#bg)"/>
  <g opacity=".18" stroke="#8fb89a" stroke-width=".6">
    <path d="M0 70h960M0 140h960M0 210h960"/>
    <path d="M80 0v280M160 0v280M240 0v280M320 0v280M400 0v280M480 0v280M560 0v280M640 0v280M720 0v280M800 0v280M880 0v280"/>
  </g>
  <rect class="scan" x="0" y="0" width="80" height="280" fill="#e8b86d" opacity="0"/>

  <text x="48" y="52" fill="#8fb89a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="3">ONE TEACHER · ONE MIND</text>
  <text x="48" y="108" fill="#f4efe4" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="700">Alvarmethod</text>
  <text x="48" y="142" fill="#c4b8a4" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">Portable skills that run Eero Alvar’s AI learning loop.</text>

  <path class="dash" d="M120 210 H280" fill="none" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
  <path class="dash" d="M400 210 H560" fill="none" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
  <path class="dash" d="M680 210 H780" fill="none" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>

  <g class="pulse p1" filter="url(#glow)">
    <rect x="48" y="178" width="232" height="64" rx="12" fill="#16221c" stroke="#e8b86d" stroke-width="1.4"/>
    <text x="164" y="206" text-anchor="middle" fill="#e8b86d" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2">01</text>
    <text x="164" y="226" text-anchor="middle" fill="#f4efe4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">Probe</text>
  </g>
  <g class="pulse p2" filter="url(#glow)">
    <rect x="328" y="178" width="232" height="64" rx="12" fill="#16221c" stroke="#8fb89a" stroke-width="1.4"/>
    <text x="444" y="206" text-anchor="middle" fill="#8fb89a" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2">02</text>
    <text x="444" y="226" text-anchor="middle" fill="#f4efe4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">Plan</text>
  </g>
  <g class="pulse p3" filter="url(#glow)">
    <rect x="608" y="178" width="232" height="64" rx="12" fill="#16221c" stroke="#e8b86d" stroke-width="1.4"/>
    <text x="724" y="206" text-anchor="middle" fill="#e8b86d" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="2">03</text>
    <text x="724" y="226" text-anchor="middle" fill="#f4efe4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">Teach</text>
  </g>
  <circle cx="872" cy="210" r="7" fill="#e8b86d">
    <animate attributeName="r" values="6;9;6" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.45;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
